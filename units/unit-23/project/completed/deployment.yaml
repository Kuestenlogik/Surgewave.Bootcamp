# Deploy Surgewave broker and notification service

# StatefulSet for Surgewave broker cluster
# Provides stable network identities, persistent storage, and ordered deployment
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: surgewave-broker
  labels:
    app: surgewave
    component: broker
spec:
  serviceName: surgewave-broker
  replicas: 3
  podManagementPolicy: Parallel  # Start all pods simultaneously
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: surgewave
      component: broker

  template:
    metadata:
      labels:
        app: surgewave
        component: broker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      terminationGracePeriodSeconds: 120  # Allow time for graceful shutdown

      # Anti-affinity to spread brokers across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: surgewave
                    component: broker
                topologyKey: kubernetes.io/hostname

      containers:
        - name: broker
          image: surgewave-broker:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: client
              containerPort: 9092
              protocol: TCP
            - name: inter-broker
              containerPort: 9093
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          # Environment from ConfigMap
          envFrom:
            - configMapRef:
                name: surgewave-broker-config

          # Pod-specific environment variables
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: Surgewave_BROKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: Surgewave_ADVERTISED_LISTENERS
              value: "PLAINTEXT://$(POD_NAME).surgewave-broker.$(POD_NAMESPACE).svc.cluster.local:9092"

          # Resource limits
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

          # Liveness probe - is the broker process running?
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe - is the broker ready to accept connections?
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # Startup probe - handle slow broker startup
          startupProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          # Volume mounts
          volumeMounts:
            - name: data
              mountPath: /var/surgewave/data
            - name: logs
              mountPath: /var/surgewave/logs

  # Persistent volume claims for broker data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: surgewave
          component: broker
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard  # Adjust for your cluster
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: logs
        labels:
          app: surgewave
          component: broker
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi

---
# Deployment for notification service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-svc
  labels:
    app: surgewave
    component: notification
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: surgewave
      component: notification

  template:
    metadata:
      labels:
        app: surgewave
        component: notification
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30

      # Spread across nodes for availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: surgewave
                    component: notification
                topologyKey: kubernetes.io/hostname

      # Init container to wait for broker
      initContainers:
        - name: wait-for-broker
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              echo "Waiting for Surgewave broker to be ready..."
              until nc -z surgewave-broker 9092; do
                echo "Broker not ready, waiting..."
                sleep 2
              done
              echo "Broker is ready!"

      containers:
        - name: notification
          image: notification-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          # Environment from ConfigMap
          envFrom:
            - configMapRef:
                name: surgewave-config

          # Additional environment variables
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"

          # Resource limits
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # Liveness probe - is the app running?
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe - is the app ready to receive traffic?
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # Startup probe - handle slow startup
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          # Lifecycle hooks for graceful shutdown
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "sleep 5"  # Allow time for load balancer to remove pod

---
# Horizontal Pod Autoscaler for notification service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-svc-hpa
  labels:
    app: surgewave
    component: notification
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-svc
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

---
# PodDisruptionBudget for notification service
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notification-svc-pdb
  labels:
    app: surgewave
    component: notification
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: surgewave
      component: notification

---
# PodDisruptionBudget for Surgewave broker
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: surgewave-broker-pdb
  labels:
    app: surgewave
    component: broker
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: surgewave
      component: broker
