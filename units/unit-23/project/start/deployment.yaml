# TODO: Create StatefulSet for Surgewave broker
# StatefulSets provide stable network identities and persistent storage

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: surgewave-broker
  labels:
    app: surgewave
    component: broker
spec:
  serviceName: surgewave-broker
  replicas: 3
  selector:
    matchLabels:
      app: surgewave
      component: broker
  template:
    metadata:
      labels:
        app: surgewave
        component: broker
    spec:
      containers:
        - name: broker
          image: surgewave-broker:latest
          # TODO: Add image pull policy
          # imagePullPolicy: IfNotPresent

          ports:
            - name: client
              containerPort: 9092
